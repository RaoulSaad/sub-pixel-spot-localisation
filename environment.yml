# The Python environment the committed results were produced with.
#
#     conda env create -f environment.yml
#     conda activate spot-localization
#     python src/run.py
#
# NumPy and SciPy do their linear algebra through OpenBLAS here. A build of
# the same versions on another library (Apple's Accelerate, as installed by
# pip on a Mac) gives the same results to 3 parts in 10,000, not to the last
# digit; see README.md.
name: spot-localization
channels:
  - defaults
dependencies:
  - python=3.13.5
  - numpy=2.1.3
  - scipy=1.15.3
  - matplotlib=3.10.0
  - blas=*=openblas
  - libopenblas=0.3.29
